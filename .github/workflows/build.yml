name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - run: cargo clippy --release --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Report size and DLL imports
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/rustorrent.exe"
          "Size: {0:N0} bytes" -f (Get-Item $exe).Length | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents $exe }
      - uses: actions/upload-artifact@v4
        with:
          name: rustorrent-windows-x64
          path: target/x86_64-pc-windows-msvc/release/rustorrent.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/rustorrent.exe
